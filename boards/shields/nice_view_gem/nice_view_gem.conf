CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# Battery saving: disable the peripheral crystal animation. The animation
# redraws the display continuously (even while idle), which is the single
# largest display power draw. With this off, a static frame is shown and the
# peripheral display only redraws on battery/connection changes.
CONFIG_NICE_VIEW_GEM_ANIMATION=n

# Hide the WPM gauge (arc + needle); keep just the chart. Also skips the
# per-redraw needle trig.
CONFIG_NICE_VIEW_GEM_WPM_SHOW_GAUGE=n